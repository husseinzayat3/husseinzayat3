<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpeedTap Arena - Reflex Battle</title>
    <style>
        :root {
            --bg: #0b0b0b;
            --primary: #ffcc00;
            --text: #ffffff;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Poppins', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }

        .logo {
            width: 120px;
            height: 120px;
            border-radius: 24px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .loader {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-left-color: var(--primary);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        p {
            color: #888;
            margin-bottom: 30px;
        }

        .btn {
            background: var(--primary);
            color: #000;
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            display: none;
        }
    </style>
</head>

<body>
    <img src="./assets/images/projects/fasttap.png" alt="SpeedTap Arena" class="logo">
    <div class="loader"></div>
    <h1>Redirecting to SpeedTap Arena...</h1>
    <p>Please wait while we take you to the correct store.</p>
    <a id="fallback-btn" href="#" class="btn">Go to Store</a>

    <script>
        const iosUrl = "https://apps.apple.com/us/app/speedtap-arena/id6760648659";
        const androidUrl = "https://play.google.com/store/apps/details?id=com.hz.fasttap";
        const fallbackUrl = "https://husseinzayat.it/#projects";

        function redirect() {
            const userAgent = (navigator.userAgent || navigator.vendor || window.opera).toLowerCase();
            const isApple = /iphone|ipad|ipod|macintosh|mac os x/.test(userAgent);
            const isAndroid = /android/i.test(userAgent);

            let targetUrl = fallbackUrl;
            if (isApple) {
                targetUrl = iosUrl;
            } else if (isAndroid) {
                targetUrl = androidUrl;
            }

            // Show manual button after a short delay if redirect fails or to let user know
            setTimeout(() => {
                const btn = document.getElementById('fallback-btn');
                btn.href = targetUrl;
                btn.style.display = 'inline-block';
            }, 1500);

            // Immediate redirect attempt
            window.location.replace(targetUrl);
        }

        window.onload = redirect;
    </script>
</body>

</html>
